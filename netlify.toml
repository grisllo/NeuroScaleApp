[build]
  # Instala Flutter stable y compila el web app con las variables de entorno de Netlify.
  # Variables requeridas en Netlify Dashboard → Site configuration → Environment variables:
  #   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_REDIRECT_URL
  command = """
    git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter &&
    export PATH="$HOME/flutter/bin:$PATH" &&
    flutter config --enable-web &&
    flutter pub get &&
    flutter build web --release \
      --dart-define=SUPABASE_URL=$SUPABASE_URL \
      --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
      --dart-define=FLAVOR=prod \
      --dart-define=SUPABASE_REDIRECT_URL=$SUPABASE_REDIRECT_URL
  """
  publish = "build/web"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
