<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Escalas neurológicas clínicas: GCS, NIHSS, Rankin, Barthel, ABCD2. Para profesionales de la salud.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NeuroScale">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NeuroScale</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    #flutter-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F2EDE8;
      gap: 20px;
    }
    #flutter-loader::after {
      content: '';
      width: 40px;
      height: 40px;
      border: 3px solid #E8E2DC;
      border-top-color: #0F6F8A;
      border-radius: 50%;
      animation: ns-spin 0.8s linear infinite;
    }
    @keyframes ns-spin { to { transform: rotate(360deg); } }
  </style>
  <div id="flutter-loader"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('flutter-loader');
      if (loader) loader.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
