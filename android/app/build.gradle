plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Carga de credenciales de firma de release. key.properties está gitignored —
// cada dev crea el suyo a partir de key.example.properties. Si no existe
// (CI o clone limpio), el build release cae a firma debug con warning para
// no romper el pipeline; el artefacto resultante NO debe publicarse.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.neuroscale.neuroscale_app"
    compileSdk = 36
    ndkVersion = rootProject.ext.get("flutter.ndkVersion")

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.neuroscale.neuroscale_app"
        minSdk = rootProject.ext.get("flutter.minSdkVersion")
        targetSdk = rootProject.ext.get("flutter.targetSdkVersion")
        versionCode = rootProject.ext.get("flutter.versionCode")
        versionName = rootProject.ext.get("flutter.versionName")
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            } else {
                println "WARNING: android/key.properties no encontrado; firmando release con clave debug. NO publicar este artefacto."
                signingConfig = signingConfigs.debug
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
