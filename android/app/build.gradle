plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.neuroscale.neuroscale_app"
    compileSdk = rootProject.ext.get("flutter.compileSdkVersion")
    ndkVersion = rootProject.ext.get("flutter.ndkVersion")

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.neuroscale.neuroscale_app"
        minSdk = rootProject.ext.get("flutter.minSdkVersion")
        targetSdk = rootProject.ext.get("flutter.targetSdkVersion")
        versionCode = rootProject.ext.get("flutter.versionCode")
        versionName = rootProject.ext.get("flutter.versionName")
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
