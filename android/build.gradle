allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Fix for app_links 6.x: expose 'flutter' as an ext map on library modules
// so flutter.compileSdkVersion resolves without the Flutter Gradle extension.
subprojects {
    if (project.name != 'app') {
        beforeEvaluate {
            ext.flutter = [
                compileSdkVersion: 36,
                minSdkVersion    : 21,
                targetSdkVersion : 35,
                ndkVersion       : "27.0.12077973",
            ]
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
