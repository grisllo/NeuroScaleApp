# Plantilla de credenciales de firma de release Android.
# Copia este archivo a android/key.properties y rellena con tus passwords reales.
# El archivo key.properties está gitignored — nunca debe commitearse.
#
# El keystore en sí (.jks) debe vivir FUERA del repo (recomendado:
# ~/.android-keystores/neuroscale-release.jks). Para generarlo:
#
#   & "C:\Program Files\Android\Android Studio\jbr\bin\keytool.exe" `
#       -genkey -v `
#       -keystore "$HOME\.android-keystores\neuroscale-release.jks" `
#       -keyalg RSA -keysize 2048 -validity 10000 `
#       -alias neuroscale-release
#
# Guarda los passwords en un gestor — si los pierdes, no podrás publicar
# actualizaciones nunca más con esta firma en Play Store.

storePassword=CAMBIAME
keyPassword=CAMBIAME
keyAlias=neuroscale-release
storeFile=C:/Users/grisllo/.android-keystores/neuroscale-release.jks
