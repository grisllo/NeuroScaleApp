flutter_launcher_icons:
  # PNG generada por: flutter test test/icon_generator_test.dart --run-skipped
  image_path: "assets/icon.png"

  # Android
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#0F6F8A"
  adaptive_icon_foreground: "assets/icon.png"

  # iOS
  ios: true
  remove_alpha_ios: true

  # Web
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#0F6F8A"
    theme_color: "#0F6F8A"
