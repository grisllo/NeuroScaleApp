name: neuroscale_app
description: Aplicación multiplataforma para escalas neurológicas y algoritmos clínicos.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  drift: ">=2.22.1 <2.23.0"
  drift_flutter: ">=0.2.4 <0.2.7"
  email_validator: ^3.0.0
  fl_chart: ">=0.68.0 <0.69.0"
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_web_plugins:
    sdk: flutter
  go_router: ^15.1.2
  intl: 0.19.0
  sentry_flutter: ^9.19.0
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.12.4

dev_dependencies:
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  drift_dev: ">=2.22.1 <2.23.0"
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  generate: true
