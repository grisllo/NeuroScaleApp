name: neuroscale_app
description: Aplicación multiplataforma para escalas neurológicas y algoritmos clínicos.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  email_validator: ^3.0.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  flutter_web_plugins:
    sdk: flutter
  go_router: ^17.2.3
  google_fonts: ^6.2.1
  intl: ^0.20.2
  sentry_flutter: ^9.19.0
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.12.4

dev_dependencies:
  build_runner: ^2.4.13
  custom_lint: ^0.8.1
  drift_dev: ^2.31.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true
  generate: true
