name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Canonicalize generated l10n format
        # `flutter gen-l10n` emits files that are not always dart-format-canonical.
        # Format them in place so the next step does not flag generator artifacts.
        run: dart format lib/l10n/generated

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  vulnerability-scan:
    name: Vulnerability scan (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Resolve dependencies
        # Genera/actualiza pubspec.lock para que el scan analice el grafo real.
        run: flutter pub get

      - name: Run osv-scanner on pubspec.lock
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=pubspec.lock
